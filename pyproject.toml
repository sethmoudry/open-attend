[tool.poetry]
name = "medgemma-openattend"
version = "0.1.0"
description = "Clinical documentation with dual-ASR + LLM fusion"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fastapi = ">=0.104.0"
uvicorn = {version = ">=0.24.0", extras = ["standard"]}
websockets = ">=12.0"
python-multipart = ">=0.0.6"
pydantic = ">=2.0"
transformers = {git = "https://github.com/huggingface/transformers.git", rev = "65dc261512cbdb1ee72b88ae5b222f2605aad8e5"}
torch = ">=2.6.0"
torchaudio = ">=2.6.0"
soundfile = ">=0.12.0"
librosa = ">=0.10.0"
numpy = ">=1.24.0"
httpx = ">=0.25.0"
reportlab = ">=4.0"
faiss-cpu = ">=1.7.0"
Pillow = ">=10.0.0"
pyannote-audio = ">=4.0.0"
huggingface-hub = ">=0.20.0"
psutil = ">=5.9.0"
pysqlcipher3 = {version = ">=1.2.0", optional = true}

[tool.poetry.extras]
encryption = ["pysqlcipher3"]

[tool.poetry.group.eval.dependencies]
jiwer = ">=3.0"
rouge-score = ">=0.1.2"
rapidfuzz = ">=3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
